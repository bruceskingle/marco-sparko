[package]
name = "marco-sparko"
description = "The Energy Explorer"
version = "0.4.4"
edition = "2024"
default-run = "marco-sparko"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
sparko_graphql_builder = { path = "../sparko_graphql/sparko_graphql_builder" }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }

[dependencies]
semver = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
serde = { version = "1.0", features = ["derive"], with = "iso8601"}
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
dirs = "5.0"
clap = { version = "4.5.13", features = ["derive", "env"] }
async-trait = "0.1.81"
#once_cell = "1.19.0"
display_json = "0.2.1"
rust_decimal = "1.36.0"
rust_decimal_macros = "1.36.0"
sparko_graphql = {version = "0.4.4", path = "../sparko_graphql" }
#serde_with = "3.9.0"
#reedline-repl-rs = { version = "1.2.1", features = ["async"] }
futures = "0.3.31"
indexmap = "2.7.1"
time-tz = { version = "2.0.0", features = ["system"] }
#tzdb = "0.7.2"
#tz-rs = "0.7.0"
dioxus = { version = "0.7.10", features = ["router", "desktop"] }
dioxus-desktop = "0.7.10"
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
# Native file dialogs, the same version and features as dioxus-desktop uses
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Clipboard access, text only
arboard = { version = "3", default-features = false }
anyhow = "1.0.100"
# Moves deleted profiles to the Trash (macOS), Recycle Bin (Windows) or freedesktop trash (Linux)
trash = "5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
webbrowser = "1.0.6"
aho-corasick = "1.1"
regex = "1.11"
rand = "0.9"


# Windows only, to create files which only their owner can access, see private_file.rs
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging"
]}

# macOS only, to position the system colour panel. The same versions as dioxus-desktop and rfd use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColorPanel", "NSEvent", "NSPanel", "NSGraphics", "NSResponder", "NSScreen", "NSWindow"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
