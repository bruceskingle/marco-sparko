query accountPropertiesMeters($accountNumber: String!) @ms_required_by_default {
  account(accountNumber: $accountNumber) {
    properties {
      id
      address
      postcode
      occupancyPeriods {
        id
        effectiveFrom
        effectiveTo @ms_optional
        isOccupier
      }
      coordinates {
        latitude
        longitude
      }
      
      electricityMeterPoints {
        id
        supplyEndDate @ms_optional
        mpan
        status
        meters {
          nodeId
          serialNumber
          consumptionUnits
          hasAndAllowsHhReadings
          importMeter @ms_optional {
            id
            nodeId
            serialNumber
          }
        }
      }
      gasMeterPoints {
        id
        supplyEndDate @ms_optional
        mprn
        status
        meters {
          nodeId
          serialNumber
          consumptionUnits
          hasAndAllowsHhReadings
        }
      }
      smartDeviceNetworks {
        smartDevices {
          deviceId
          type
        }
      }
    }
  }
}

query meterAgreements($meterNodeId: ID!, $validAfter: DateTime) @ms_required_by_default {
  node(id: $meterNodeId) {
    ... on ElectricityMeterType @ms_required_by_default {
    	nodeId
      importMeter @ms_optional {
        meterPoint {
          mpan
        }
      }
      meterPoint {
        mpan
        agreements(excludeFuture: false, validAfter: $validAfter, includeInactive: true) {
          id
          validFrom
          validTo @ms_optional
          tariff {
            ... on HalfHourlyTariff {
              displayName
              fullName
              standingCharge
#              unitRates {
#                validFrom
#                validTo
#                preVatValue
#                value
#              }
              description
              preVatStandingCharge @ms_optional
              productCode
              tariffCode
            }
            ... on StandardTariff @ms_required_by_default {
              id
              description
              displayName
              fullName
              preVatStandingCharge @ms_optional
              preVatUnitRate @ms_optional
              standingCharge @ms_optional
              tariffCode
              unitRate @ms_optional
            }
            ... on DayNightTariff @ms_required_by_default {
              id
              dayRate
              description
              displayName
              fullName
              nightRate
              preVatDayRate
              preVatNightRate
              preVatStandingCharge @ms_optional
              standingCharge @ms_optional
              tariffCode
            }
            ... on ThreeRateTariff @ms_required_by_default {
              id
              dayRate
              description
              displayName
              fullName
              nightRate
              offPeakRate
              preVatDayRate
              preVatNightRate
              preVatOffPeakRate
              preVatStandingCharge @ms_optional
              standingCharge @ms_optional
              tariffCode
            }
            ... on FourRateEvTariff @ms_required_by_default {
              id
              dayRate
              description
              displayName
              fullName
              nightRate
              evDeviceOffPeakRate
              evDevicePeakRate
              preVatDayRate
              preVatNightRate
              preVatEvDeviceOffPeakRate
              preVatEvDevicePeakRate
              preVatStandingCharge @ms_optional
              standingCharge @ms_optional
              tariffCode
            }
            ... on PrepayTariff @ms_required_by_default {
              id
              displayName
              fullName
              preVatStandingCharge @ms_optional
              preVatUnitRate
              productCode
              standingCharge @ms_optional
              tariffCode
              unitRate
            }
          }
        }
      }
    }
    ... on GasMeterType @ms_required_by_default {
    	nodeId
      meterPoint {
        agreements(excludeFuture: false, validAfter: $validAfter) @ms_required_by_default {
          id
          validFrom
          validTo @ms_optional
          tariff {
            id
            description
            displayName
            fullName
            preVatStandingCharge @ms_optional
            preVatUnitRate @ms_optional
            standingCharge @ms_optional
            unitRate @ms_optional
            productCode @ms_optional
            tags @ms_optional
            tariffCode
            unitRateEpgApplied @ms_optional
          }
        }
      }
    }
  }
}

query electricityAgreementLineItems($agreementId: ID!, $startAt: DateTime!, $first: Int, $timezone: String!, $itemType: LineItemTypeOptions!, $lineItemGrouping: LineItemGroupingOptions!, $after: String) @ms_required_by_default {
  electricityAgreement(id: $agreementId) @ms_required_by_default {
    ... on ElectricityAgreementType  @ms_required_by_default{
      meterPoint {
        mpan
      }
      lineItems(first: $first, grouping: $lineItemGrouping, startAt: $startAt, itemType: $itemType, timezone: $timezone, after: $after) {
        ...lineItems
      }
    }
  }
}

fragment lineItems on LineItemConnection @ms_required_by_default {
  edges {
    node {
      startAt
      endAt
      netAmount
      numberOfUnits
      settlementUnit
    }
    cursor
  }
  pageInfo {
    hasNextPage
    hasPreviousPage
    endCursor
    startCursor
  }
}

query gasAgreementLineItems($agreementId: ID!, $startAt: DateTime!, $first: Int, $timezone: String!, $itemType: LineItemTypeOptions!, $lineItemGrouping: LineItemGroupingOptions!, $after: String) @ms_required_by_default {
  gasAgreement(id: $agreementId) @ms_required_by_default {
    ... on GasAgreementType  @ms_required_by_default {
      meterPoint {
        mprn
      }
      lineItems(first: $first, grouping: $lineItemGrouping, startAt: $startAt, itemType: $itemType, timezone: $timezone, after: $after) {
        ...lineItems
      }
    }
  }
}

query getCurrentDemand(
  $meterDeviceId: String!, 
  $start: DateTime, 
  $end: DateTime, 
  $grouping: TelemetryGrouping
) {
  	smartMeterTelemetry(deviceId: $meterDeviceId
      start: $start
      end: $end
      grouping: $grouping
    ) {
    	readAt
    	demand
    }
  }

query meterConsumption($meterId: ID!, $grouping: ConsumptionGroupings!, $startAt: DateTime!, $first: Int, $timezone: String!, $after: String) @ms_required_by_default {
  node(id: $meterId) @ms_required_by_default {
    ... on ElectricityMeterType {
      ...meterFields
      importMeter: importMeter {
        id
      }
    }
    ... on GasMeterType {
      ...meterFields
    }
  }
}

fragment meterFields on Meter @ms_required_by_default {
  consumptionUnits
  consumption(first: $first, grouping: $grouping, startAt: $startAt, timezone: $timezone, after: $after) {
    ...consumptionFields
  }
  serialNumber
}

fragment consumptionFields on ConsumptionConnection @ms_required_by_default {
  edges {
    node {
      value
      startAt
      endAt
    }
    cursor
  }
  pageInfo {
    endCursor
    hasNextPage
  }
}

query activeMeterPointsWithAgreements($accountNumber: String!) {
  account(accountNumber: $accountNumber) {
    properties {
      electricityMeterPoints {
        mpan
        direction
        agreements(excludeFuture: true, includeInactive: false) {
          tariff {
            __typename
            ... on TariffType {
              productCode
              __typename
            }
          }
          # When each rate applies, e.g. ECO7_NIGHT from 23:30 to 05:30, for tariffs with times of use.
          timeOfUseScheme {
            name
            timezone
            timeslots {
              timeslot
              activeFrom
              activeTo
            }
          }
          __typename
        }
        __typename
      }
      __typename
    }
    __typename
  }
}

query homeAndEvConsumptionBreakdown(
  $accountNumber: String!
  $first: Int!
  $utilityFilters: [UtilityFiltersInput!]
  $startOn: Date
  $endOn: Date
  $startAt: DateTime
  $endAt: DateTime
  $timezone: String
  $cursor: String
) {
  account(accountNumber: $accountNumber) {
    properties {
      id
      measurements(
        first: $first
        utilityFilters: $utilityFilters
        startOn: $startOn
        endOn: $endOn
        startAt: $startAt
        endAt: $endAt
        timezone: $timezone
        after: $cursor
      ) {
        edges {
          cursor
          node {
            value
            unit
            ... on IntervalMeasurementType {
              startAt
              endAt
            }
            metaData {
              statistics {
                costExclTax {
                  costCurrency @ms_currency
                  pricePerUnit {
                    amount
                  }
                  estimatedAmount
                }
                costInclTax {
                  costCurrency @ms_currency
                  pricePerUnit {
                    amount
                  }
                  estimatedAmount
                }
                value
                label
                type
              }
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
        __typename
      }
      __typename
    }
    __typename
  }
}
query smartDevices($accountNumber: String!) {
  devices(accountNumber: $accountNumber) {
    id
    name
    deviceType
    provider
    propertyId
    __typename
    ... on SmartFlexChargePoint {
      make
      model
      vehicleBatterySize
      chargePointPowerOutput
    }
    ... on SmartFlexVehicle {
      make
      model
      vehicleBatterySize
      chargePointPowerOutput
    }
  }
}

query chargingSessions($accountNumber: String!, $deviceId: String!, $after: DateTime, $before: DateTime, $first: Int) {
  devices(accountNumber: $accountNumber, deviceId: $deviceId) {
    id
    __typename
    # Charge points and vehicles, the devices which charge.
    ... on ElectricDevice {
      chargingSessions(after: $after, before: $before, first: $first) {
        ...chargingSessionFields
      }
    }
  }
}

fragment chargingSessionFields on DeviceChargingSessionConnection {
  edges {
    node {
      start
      end
      __typename
      ... on SmartFlexChargingSession {
        stateOfChargeChange
        stateOfChargeFinal
        energyAdded {
          value
          unit
        }
        cost {
          amount
          currency
        }
        type
        targetType
        dispatches {
          start
          end
          type
          energyAddedKwh
        }
        problems {
          __typename
          ... on SmartFlexChargingTruncation {
            truncationCause
            originalAchievableStateOfCharge
            achievableStateOfCharge
          }
          ... on SmartFlexChargingError {
            cause
          }
        }
      }
      ... on PublicChargingSession {
        energyAdded {
          value
          unit
        }
        cost {
          amount
          currency
        }
        location
      }
    }
  }
}

query meterTelemetry($deviceId: String!, $start: DateTime, $end: DateTime, $grouping: TelemetryGrouping) {
  smartMeterTelemetry(deviceId: $deviceId, start: $start, end: $end, grouping: $grouping) {
    readAt
    consumption
    export
    demand
    consumptionDelta
    costDelta
    costDeltaWithTax
  }
}

# The rate limits of the fields which have them, to find when a field which is blocked for too many requests can be
# requested again.
query rateLimit {
  rateLimitInfo {
    fieldSpecificRateLimits(first: 100) {
      edges {
        node {
          field
          rate
          ttl
          isBlocked
        }
      }
    }
  }
}
